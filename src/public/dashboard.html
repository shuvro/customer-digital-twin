<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Digital Twin — Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242836;
      --border: #2e3347;
      --text: #e4e7ef;
      --text-muted: #8b90a5;
      --accent: #6c8aff;
      --accent2: #47d4a0;
      --warn: #f5a623;
      --danger: #e85d5d;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'SF Mono', SFMono-Regular, 'Cascadia Code', Consolas, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header h1 span { color: var(--accent); }
    .metrics-bar { display: flex; gap: 20px; font-size: 13px; }
    .metric { display: flex; align-items: center; gap: 6px; }
    .metric-label { color: var(--text-muted); }
    .metric-value { font-weight: 600; font-family: var(--mono); }
    .metric-value.good { color: var(--accent2); }
    .metric-value.warn { color: var(--warn); }
    .metric-value.danger { color: var(--danger); }

    /* Layout */
    .main { display: grid; grid-template-columns: 300px 1fr; grid-template-rows: 1fr auto; flex: 1; overflow: hidden; }

    /* Sidebar */
    .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; grid-row: 1 / -1; }
    .search-box { padding: 12px; border-bottom: 1px solid var(--border); }
    .search-box input { width: 100%; padding: 8px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13px; outline: none; }
    .search-box input:focus { border-color: var(--accent); }
    .customer-list { flex: 1; overflow-y: auto; }
    .customer-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
    .customer-item:hover { background: var(--surface2); }
    .customer-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }
    .customer-item .name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
    .customer-item .meta { font-size: 12px; color: var(--text-muted); }

    /* Alerts */
    .alert-banner { padding: 10px 16px; background: #3d2e10; border-bottom: 1px solid var(--warn); font-size: 13px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .alert-banner.hidden { display: none; }

    /* Content */
    .content { overflow-y: auto; padding: 24px; }
    .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 15px; }

    /* Profile card */
    .profile { max-width: 900px; }
    .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .profile-header .info h2 { font-size: 20px; font-weight: 700; }
    .profile-header .info .sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    /* Data layers */
    .layer { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
    .layer-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
    .layer-header .icon { font-size: 16px; }
    .layer-body { padding: 16px; }

    /* Grid for identity fields */
    .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .field-item { }
    .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 4px; }
    .field-value { font-size: 14px; font-weight: 500; }

    /* Pills for insights */
    .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .pill { padding: 4px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 16px; font-size: 12px; }
    .pill.hobby { border-color: #6c8aff44; color: var(--accent); }
    .pill.need { border-color: #47d4a044; color: var(--accent2); }
    .pill.risk { border-color: #e85d5d44; color: var(--danger); }
    .pill.pref { border-color: #f5a62344; color: var(--warn); }
    .pill.family { border-color: #c084fc44; color: #c084fc; }
    .pill.note { border-color: #8b90a544; color: var(--text-muted); }
    .insight-group { margin-bottom: 8px; }
    .insight-group-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }

    /* Attribute history */
    .attr-group { margin-bottom: 12px; }
    .attr-group-label { font-size: 12px; font-weight: 600; margin-bottom: 6px; text-transform: capitalize; }
    .attr-current { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .attr-history { font-size: 12px; color: var(--text-muted); cursor: pointer; }
    .attr-history:hover { color: var(--text); }
    .history-list { display: none; margin-top: 6px; padding-left: 12px; border-left: 2px solid var(--border); }
    .history-list.open { display: block; }
    .history-entry { font-size: 12px; color: var(--text-muted); padding: 2px 0; }
    .history-entry .date { font-family: var(--mono); }

    /* Timeline */
    .timeline-section { border-top: 1px solid var(--border); background: var(--surface); grid-column: 2; }
    .timeline-header { padding: 12px 16px; font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--border); }
    .timeline-body { display: flex; gap: 0; overflow-x: auto; padding: 12px 16px; }
    .timeline-item { min-width: 180px; padding: 8px 12px; border-left: 2px solid var(--accent); margin-right: 12px; flex-shrink: 0; }
    .timeline-item .tl-date { font-size: 11px; font-family: var(--mono); color: var(--text-muted); }
    .timeline-item .tl-source { font-size: 13px; font-weight: 500; margin-top: 2px; }
    .timeline-item .tl-conf { font-size: 11px; color: var(--text-muted); }

    /* Duplicates modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-overlay.hidden { display: none; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
    .modal h3 { margin-bottom: 16px; font-size: 16px; }
    .dup-pair { padding: 12px; background: var(--surface2); border-radius: var(--radius); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .dup-info { font-size: 13px; }
    .dup-score { font-family: var(--mono); font-size: 13px; font-weight: 600; }
    .btn { padding: 6px 14px; border: none; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="header">
    <h1><span>&#9671;</span> Customer Digital Twin</h1>
    <div class="metrics-bar" id="metricsBar">
      <div class="metric"><span class="metric-label">Processed</span><span class="metric-value" id="mProcessed">—</span></div>
      <div class="metric"><span class="metric-label">Error Rate</span><span class="metric-value" id="mErrorRate">—</span></div>
      <div class="metric"><span class="metric-label">Avg Pipeline</span><span class="metric-value" id="mAvgPipeline">—</span></div>
      <div class="metric"><span class="metric-label">Customers</span><span class="metric-value" id="mCustomers">—</span></div>
    </div>
  </div>

  <div class="alert-banner hidden" id="dupAlert">
    <span>&#9888;</span>
    <span id="dupAlertText"></span>
    <button class="btn btn-sm btn-ghost" onclick="showDuplicates()">Review</button>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search customers..." oninput="filterCustomers()">
      </div>
      <div class="customer-list" id="customerList"></div>
    </div>

    <div class="content" id="content">
      <div class="empty-state">Select a customer to view their profile</div>
    </div>

    <div class="timeline-section" id="timeline" style="display:none;">
      <div class="timeline-header">Message Timeline</div>
      <div class="timeline-body" id="timelineBody"></div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="dupModal">
    <div class="modal">
      <h3>Potential Duplicates</h3>
      <div id="dupList"></div>
      <div style="text-align:right;margin-top:16px;">
        <button class="btn btn-ghost" onclick="closeDupModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin + '/api';
    let allCustomers = [];
    let selectedId = null;
    let duplicatesData = null;

    async function fetchJSON(url) {
      const res = await fetch(url);
      return res.json();
    }

    async function loadMetrics() {
      try {
        const data = await fetchJSON(API + '/metrics');
        document.getElementById('mProcessed').textContent = data.pipeline.messagesProcessed;
        const errRate = (data.errorRate * 100).toFixed(1) + '%';
        const errEl = document.getElementById('mErrorRate');
        errEl.textContent = errRate;
        errEl.className = 'metric-value ' + (data.errorRate > 0.1 ? 'danger' : data.errorRate > 0.05 ? 'warn' : 'good');
        const avg = data.timings.total.avg;
        document.getElementById('mAvgPipeline').textContent = avg ? avg + 'ms' : '—';
        document.getElementById('mCustomers').textContent = data.database.customers;
      } catch { /* silent */ }
    }

    async function loadCustomers() {
      try {
        const data = await fetchJSON(API + '/customers');
        allCustomers = data.customers || [];
        renderCustomerList(allCustomers);
      } catch { /* silent */ }
    }

    async function loadDuplicates() {
      try {
        const data = await fetchJSON(API + '/customers/duplicates?minScore=0.5');
        duplicatesData = data;
        const alert = document.getElementById('dupAlert');
        if (data.duplicates && data.duplicates.length > 0) {
          document.getElementById('dupAlertText').textContent =
            data.duplicates.length + ' potential duplicate pair(s) found';
          alert.classList.remove('hidden');
        } else {
          alert.classList.add('hidden');
        }
      } catch { /* silent */ }
    }

    function renderCustomerList(customers) {
      const el = document.getElementById('customerList');
      if (customers.length === 0) {
        el.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px;">No customers found</div>';
        return;
      }
      el.innerHTML = customers.map(c => `
        <div class="customer-item ${c.id === selectedId ? 'active' : ''}" onclick="selectCustomer('${c.id}')">
          <div class="name">${esc(c.firstName || '')} ${esc(c.lastName || '')}</div>
          <div class="meta">${esc(c.taxId || '—')} &middot; ${c.messageCount} msg${c.messageCount !== 1 ? 's' : ''}</div>
        </div>
      `).join('');
    }

    function filterCustomers() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allCustomers.filter(c => {
        const text = [c.firstName, c.lastName, c.taxId, c.nationality].filter(Boolean).join(' ').toLowerCase();
        return text.includes(q);
      });
      renderCustomerList(filtered);
    }

    async function selectCustomer(id) {
      selectedId = id;
      renderCustomerList(allCustomers.filter(c => {
        const q = document.getElementById('searchInput').value.toLowerCase();
        if (!q) return true;
        const text = [c.firstName, c.lastName, c.taxId, c.nationality].filter(Boolean).join(' ').toLowerCase();
        return text.includes(q);
      }));
      try {
        const data = await fetchJSON(API + '/customers/' + id);
        renderProfile(data.customer);
      } catch { /* silent */ }
    }

    function renderProfile(c) {
      const content = document.getElementById('content');
      const initials = ((c.firstName || '')[0] || '') + ((c.lastName || '')[0] || '');

      content.innerHTML = `
        <div class="profile">
          <div class="profile-header">
            <div class="avatar">${esc(initials.toUpperCase())}</div>
            <div class="info">
              <h2>${esc(c.firstName || '')} ${esc(c.lastName || '')}</h2>
              <div class="sub">${esc(c.nationality || '—')} &middot; ${esc(c.taxId || '—')} &middot; ID: ${esc(c.id)}</div>
            </div>
          </div>

          ${renderIdentityLayer(c)}
          ${renderAttributeLayer(c)}
          ${renderInsightLayer(c)}
        </div>
      `;

      renderTimeline(c.messages || []);
    }

    function renderIdentityLayer(c) {
      const fields = [
        ['First Name', c.firstName],
        ['Last Name', c.lastName],
        ['Date of Birth', c.dateOfBirth],
        ['Nationality', c.nationality],
        ['Gender', c.gender],
        ['Tax ID', c.taxId],
      ];
      return `
        <div class="layer">
          <div class="layer-header"><span class="icon">&#128274;</span> Identity (Immutable)</div>
          <div class="layer-body">
            <div class="field-grid">
              ${fields.map(([label, val]) => `
                <div class="field-item">
                  <div class="field-label">${label}</div>
                  <div class="field-value">${esc(val || '—')}</div>
                </div>
              `).join('')}
            </div>
            ${renderConflicts(c.identityConflicts)}
          </div>
        </div>
      `;
    }

    function renderConflicts(conflicts) {
      if (!conflicts || !Array.isArray(conflicts) || conflicts.length === 0) return '';
      return `
        <div style="margin-top:12px;padding:8px 12px;background:#3d2e10;border-radius:var(--radius);font-size:12px;">
          <strong>Conflicts:</strong>
          ${conflicts.map(c => `<div style="margin-top:4px;">${esc(c.field)}: kept "${esc(c.keptValue)}", rejected "${esc(c.rejectedValue)}" ${c.type === 'merge' ? '(merge)' : ''}</div>`).join('')}
        </div>
      `;
    }

    function renderAttributeLayer(c) {
      const attrs = c.attributes || {};
      if (Object.keys(attrs).length === 0) return '';

      return `
        <div class="layer">
          <div class="layer-header"><span class="icon">&#9998;</span> Attributes (Mutable)</div>
          <div class="layer-body">
            ${Object.entries(attrs).map(([field, entries]) => renderAttrGroup(field, entries)).join('')}
          </div>
        </div>
      `;
    }

    function renderAttrGroup(field, entries) {
      const current = entries.filter(e => e.isCurrent);
      const historical = entries.filter(e => !e.isCurrent);
      const uid = 'hist-' + field + '-' + Math.random().toString(36).slice(2, 8);
      const displayVal = field === 'address'
        ? current.map(e => formatAddr(e)).join('; ')
        : current.map(e => esc(e.value)).join(', ');

      return `
        <div class="attr-group">
          <div class="attr-group-label">${esc(field)}</div>
          <div class="attr-current">${displayVal || '—'}</div>
          ${historical.length > 0 ? `
            <div class="attr-history" onclick="toggleHistory('${uid}')">${historical.length} historical value${historical.length !== 1 ? 's' : ''} &#9662;</div>
            <div class="history-list" id="${uid}">
              ${historical.map(h => `
                <div class="history-entry"><span class="date">${h.messageDate.slice(0,10)}</span> — ${field === 'address' ? formatAddr(h) : esc(h.value)}</div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

    function formatAddr(entry) {
      if (entry.valueJson) {
        const a = typeof entry.valueJson === 'string' ? JSON.parse(entry.valueJson) : entry.valueJson;
        return esc(a.fullAddress || a.street || entry.value);
      }
      try {
        const a = JSON.parse(entry.value);
        return esc(a.fullAddress || a.street || entry.value);
      } catch { return esc(entry.value); }
    }

    function renderInsightLayer(c) {
      const insights = c.insights || {};
      if (Object.keys(insights).length === 0) return '';

      const catMap = {
        hobbies: 'hobby', needs: 'need', riskIndicators: 'risk',
        communicationPreferences: 'pref', familyContext: 'family', notes: 'note',
      };

      return `
        <div class="layer">
          <div class="layer-header"><span class="icon">&#128161;</span> Insights (Inferred)</div>
          <div class="layer-body">
            ${Object.entries(insights).map(([field, entries]) => `
              <div class="insight-group">
                <div class="insight-group-label">${esc(field.replace(/([A-Z])/g, ' $1'))}</div>
                <div class="pills">
                  ${entries.map(e => `<span class="pill ${catMap[field] || 'note'}">${esc(e.value)}</span>`).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderTimeline(messages) {
      const section = document.getElementById('timeline');
      const body = document.getElementById('timelineBody');
      if (!messages || messages.length === 0) { section.style.display = 'none'; return; }
      section.style.display = '';
      const sorted = [...messages].sort((a, b) => new Date(a.messageDate) - new Date(b.messageDate));
      body.innerHTML = sorted.map(m => `
        <div class="timeline-item">
          <div class="tl-date">${m.messageDate.slice(0,10)}</div>
          <div class="tl-source">${esc(m.source)} — ${esc(m.id)}</div>
          <div class="tl-conf">confidence: ${m.confidence != null ? (m.confidence * 100).toFixed(0) + '%' : '—'}${m.matchScore != null ? ' &middot; match: ' + (m.matchScore * 100).toFixed(0) + '%' : ''}</div>
        </div>
      `).join('');
    }

    function toggleHistory(id) {
      document.getElementById(id).classList.toggle('open');
    }

    function showDuplicates() {
      if (!duplicatesData) return;
      const list = document.getElementById('dupList');
      list.innerHTML = duplicatesData.duplicates.map(d => `
        <div class="dup-pair">
          <div class="dup-info">
            <div><strong>${esc((d.customerA.firstName || '') + ' ' + (d.customerA.lastName || ''))}</strong> &harr; <strong>${esc((d.customerB.firstName || '') + ' ' + (d.customerB.lastName || ''))}</strong></div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">Signals: ${d.signals.join(', ')}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="dup-score">${(d.score * 100).toFixed(0)}%</span>
            <button class="btn btn-sm btn-primary" onclick="doMerge('${d.customerA.id}','${d.customerB.id}')">Merge</button>
          </div>
        </div>
      `).join('');
      document.getElementById('dupModal').classList.remove('hidden');
    }

    function closeDupModal() {
      document.getElementById('dupModal').classList.add('hidden');
    }

    async function doMerge(sourceId, targetId) {
      if (!confirm('Merge ' + sourceId + ' into ' + targetId + '?')) return;
      try {
        const res = await fetch(API + '/customers/merge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sourceCustomerId: sourceId, targetCustomerId: targetId }),
        });
        const data = await res.json();
        if (data.status === 'ok') {
          closeDupModal();
          refresh();
        } else {
          alert('Merge failed: ' + (data.message || 'unknown error'));
        }
      } catch (err) {
        alert('Merge error: ' + err.message);
      }
    }

    function esc(s) {
      if (s == null) return '';
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    async function refresh() {
      await Promise.all([loadMetrics(), loadCustomers(), loadDuplicates()]);
    }

    // Init
    refresh();
    setInterval(loadMetrics, 10000);
  </script>
</body>
</html>
